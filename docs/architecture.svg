<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1220" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order flow</title>
  <desc id="desc">One-page map of ShopLedger UI, Express server, routers, library modules, configuration, JSON data store, and order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:750}.sub{font-size:14px;fill:#64748b}
      .section{font-size:16px;font-weight:700;fill:#334155;letter-spacing:.04em}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:12}
      .ui{fill:#eff6ff;stroke:#93c5fd}.router{fill:#f5f3ff;stroke:#c4b5fd}
      .module{fill:#f8fafc;stroke:#cbd5e1}.data{fill:#ecfdf5;stroke:#6ee7b7}
      .config{fill:#fff7ed;stroke:#fdba74}.flow{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5;rx:12}
      .head{font-size:16px;font-weight:700}.label{font-size:12px;fill:#475569}.small{font-size:11px;fill:#64748b}
      .edge{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow);opacity:.78}
      .orderEdge{fill:none;stroke:#ea580c;stroke-width:2.6;marker-end:url(#orangeArrow)}
      .divider{stroke:#e2e8f0;stroke-width:1}
    </style>
  </defs>
  <rect width="1640" height="1220" fill="#f8fafc"/>
  <text x="36" y="48" class="title">ShopLedger — app map</text>
  <text x="36" y="74" class="sub">Express 4 · browser UI · file-backed JSON data · invoice and order calculations</text>

  <text x="36" y="116" class="section">BROWSER UI</text>
  <rect x="32" y="132" width="280" height="514" class="box ui"/>
  <text x="52" y="163" class="head">public/</text>
  <text x="52" y="187" class="label">index.html · app.js · style.css</text>
  <line x1="52" y1="202" x2="292" y2="202" class="divider"/>
  <text x="52" y="230" class="label">New Order (POS)</text>
  <text x="52" y="258" class="label">Order History</text>
  <text x="52" y="286" class="label">Customer Khata</text>
  <text x="52" y="314" class="label">Inventory &amp; GST Audit</text>
  <text x="52" y="354" class="small">XHR calls use /api routes.</text>
  <text x="52" y="374" class="small">Invoice links open printable HTML.</text>

  <text x="352" y="116" class="section">HTTP APP</text>
  <rect x="346" y="132" width="245" height="180" class="box"/>
  <text x="366" y="166" class="head">server.js</text>
  <text x="366" y="192" class="label">Express app</text>
  <text x="366" y="216" class="label">Serves public/</text>
  <text x="366" y="240" class="label">Mounts four routers at /api</text>
  <text x="366" y="264" class="label">GET /orders/:id/invoice</text>
  <text x="366" y="288" class="small">Starts on config.port</text>

  <text x="630" y="116" class="section">ROUTERS (routes/)</text>
  <rect x="624" y="132" width="350" height="150" class="box router"/>
  <text x="644" y="162" class="head">products.js</text>
  <text x="644" y="187" class="label">GET /products · GET /coupons</text>
  <text x="644" y="212" class="small">Catalog, stock and GST display; active coupons</text>

  <rect x="624" y="304" width="350" height="214" class="box router"/>
  <text x="644" y="334" class="head">orders.js</text>
  <text x="644" y="359" class="label">GET /orders · GET /orders/:id</text>
  <text x="644" y="384" class="label">POST /orders · POST /orders/:id/cancel</text>
  <text x="644" y="414" class="small">Checks products, stock and coupon; computes totals;</text>
  <text x="644" y="434" class="small">optionally charges Khata, reserves stock, saves order.</text>
  <text x="644" y="474" class="small">Highlighted edges show POST /orders flow.</text>

  <rect x="624" y="540" width="350" height="124" class="box router"/>
  <text x="644" y="570" class="head">customers.js</text>
  <text x="644" y="595" class="label">GET /customers · POST /customers/:id/settle</text>
  <text x="644" y="622" class="small">Customer balances and settlement writes</text>

  <rect x="624" y="686" width="350" height="164" class="box router"/>
  <text x="644" y="716" class="head">reports.js</text>
  <text x="644" y="741" class="label">GET /reports/dashboard</text>
  <text x="644" y="764" class="label">GET /reports/gst-reconciliation</text>
  <text x="644" y="787" class="label">POST /pricing/preview · GET /admin/export</text>
  <text x="644" y="818" class="small">Dashboard, invoice reconciliation, live pricing preview</text>

  <text x="1010" y="116" class="section">MODULES (lib/)</text>
  <rect x="1004" y="132" width="280" height="110" class="box module"/>
  <text x="1024" y="163" class="head">inventory.js</text>
  <text x="1024" y="188" class="label">find · check · reserve · release</text>
  <text x="1024" y="212" class="small">sellable stock and inventory summary</text>

  <rect x="1004" y="262" width="280" height="110" class="box module"/>
  <text x="1024" y="293" class="head">pricing.js</text>
  <text x="1024" y="318" class="label">subtotal · discount · computeTotals</text>
  <text x="1024" y="342" class="small">line GST, coupon allocation and totals</text>

  <rect x="1004" y="392" width="280" height="90" class="box module"/>
  <text x="1024" y="423" class="head">coupons.js</text>
  <text x="1024" y="448" class="label">normalize · validate · calculateDiscount</text>

  <rect x="1004" y="502" width="280" height="90" class="box module"/>
  <text x="1024" y="533" class="head">tax.js</text>
  <text x="1024" y="558" class="label">HSN rate selection · CGST/SGST split</text>

  <rect x="1004" y="612" width="280" height="80" class="box module"/>
  <text x="1024" y="643" class="head">dates.js</text>
  <text x="1024" y="668" class="label">today · date normalization · fiscal year</text>

  <rect x="1004" y="712" width="280" height="110" class="box module"/>
  <text x="1024" y="743" class="head">store.js</text>
  <text x="1024" y="768" class="label">read · write · appendAudit</text>
  <text x="1024" y="792" class="small">Synchronous JSON file persistence</text>

  <rect x="1310" y="132" width="290" height="100" class="box module"/>
  <text x="1330" y="163" class="head">orders.js</text>
  <text x="1330" y="188" class="label">add · get · cancel · list</text>
  <text x="1330" y="212" class="small">Order records, filtering and cancellation</text>

  <rect x="1310" y="252" width="290" height="110" class="box module"/>
  <text x="1330" y="283" class="head">ledger.js</text>
  <text x="1330" y="308" class="label">customer lookup · Khata charge/reverse</text>
  <text x="1330" y="332" class="small">settlements and balances</text>

  <rect x="1310" y="382" width="290" height="110" class="box module"/>
  <text x="1330" y="413" class="head">reports.js</text>
  <text x="1330" y="438" class="label">dashboard summary · GST reconciliation</text>
  <text x="1330" y="462" class="small">reads stored orders and invoice calculations</text>

  <rect x="1310" y="512" width="290" height="130" class="box module"/>
  <text x="1330" y="543" class="head">invoice.js</text>
  <text x="1330" y="568" class="label">computeInvoiceFigures · render</text>
  <text x="1330" y="592" class="small">Printable invoice HTML; uses pricing.js</text>
  <text x="1330" y="616" class="small">for invoice figures</text>

  <rect x="1310" y="662" width="290" height="80" class="box config"/>
  <text x="1330" y="693" class="head">config.js</text>
  <text x="1330" y="718" class="label">port · shop · tax slabs · coupons · admin key</text>

  <rect x="1310" y="762" width="290" height="90" class="box data"/>
  <text x="1330" y="793" class="head">data/db.json</text>
  <text x="1330" y="818" class="label">products · orders · customers · settlements</text>
  <text x="1330" y="840" class="small">auditLog and next ID counters</text>

  <!-- Main request path -->
  <path d="M312 235 H346" class="edge"/>
  <path d="M591 220 H606 V205 H624" class="edge"/>
  <path d="M591 245 H606 V410 H624" class="orderEdge"/>
  <path d="M591 270 H606 V602 H624" class="edge"/>
  <path d="M591 285 H606 V768 H624" class="edge"/>
  <path d="M591 288 H600 V873 H1290 V577 H1310" class="edge"/>
  <path d="M974 190 H1004" class="edge"/>
  <path d="M974 205 H992 V547 H1004" class="edge"/>
  <path d="M974 220 H988 V437 H1004" class="edge"/>
  <path d="M974 370 H992 V185 H1004" class="orderEdge"/>
  <path d="M974 388 H994 V315 H1004" class="orderEdge"/>
  <path d="M974 405 H996 V437 H1004" class="orderEdge"/>
  <path d="M974 444 H1292 V182 H1310" class="orderEdge"/>
  <path d="M974 461 H1294 V307 H1310" class="orderEdge"/>
  <path d="M974 482 H992 V767 H1004" class="orderEdge"/>
  <path d="M974 595 H1292 V307 H1310" class="edge"/>
  <path d="M974 622 H990 V767 H1004" class="edge"/>
  <path d="M974 741 H1290 V437 H1310" class="edge"/>
  <path d="M974 764 H994 V315 H1004" class="edge"/>
  <path d="M974 787 H1292 V702 H1310" class="edge"/>
  <path d="M974 810 H990 V767 H1004" class="edge"/>
  <path d="M1284 315 H1298 V315 H1310" class="edge"/>
  <path d="M1004 327 H990 V437 H1004" class="edge"/>
  <path d="M1004 343 H986 V547 H1004" class="edge"/>
  <path d="M1310 185 H1292 V185 H1284" class="edge"/>
  <path d="M1455 232 V252" class="edge"/>
  <path d="M1310 200 H1290 V652 H1284" class="edge"/>
  <path d="M1310 340 H1294 V652 H1284" class="edge"/>
  <path d="M1310 425 H1292 V185 H1284" class="edge"/>
  <path d="M1310 450 H1292 V307 H1310" class="edge"/>
  <path d="M1310 580 H1290 V315 H1284" class="edge"/>
  <path d="M1284 767 H1298 V807 H1310" class="edge"/>
  <path d="M1455 642 V662" class="edge"/>
  <path d="M1144 822 V865 H1455 V852" class="edge"/>
  <path d="M1310 702 H1296 V767 H1310" class="edge"/>

  <rect x="32" y="890" width="1568" height="270" class="flow"/>
  <text x="58" y="928" class="section" fill="#9a3412">ORDER PLACEMENT FLOW</text>
  <text x="58" y="966" class="head">1</text><text x="84" y="966" class="label">UI sends POST /api/orders with item IDs, quantities, coupon, customer and payment mode.</text>
  <text x="58" y="1002" class="head">2</text><text x="84" y="1002" class="label">routes/orders.js resolves catalog items; checks stock and coupon; calls pricing.computeTotals.</text>
  <text x="58" y="1038" class="head">3</text><text x="84" y="1038" class="label">For Khata, ledger.js charges the customer. inventory.js reserves units; orders.js adds the order.</text>
  <text x="58" y="1074" class="head">4</text><text x="84" y="1074" class="label">The route appends an audit entry, store.js writes data/db.json, and the API returns HTTP 201.</text>
  <text x="58" y="1110" class="head">5</text><text x="84" y="1110" class="label">Invoice link calls GET /orders/:id/invoice; server loads the order, then invoice.js renders printable HTML.</text>
  <text x="58" y="1142" class="small">Orange arrows mark the POST /orders path. Grey arrows show major module dependencies and data access.</text>
</svg>
